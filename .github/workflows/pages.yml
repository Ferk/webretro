name: Build and Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y jq make wget zip

      - name: Install Node and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Yarn
        run: corepack enable

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install latest
          "$RUNNER_TEMP/emsdk/emsdk" activate latest
          echo "$RUNNER_TEMP/emsdk" >> "$GITHUB_PATH"
          echo "EMSCRIPTEN=$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_ENV"

      - name: Build static site
        run: ./scripts/build-pages.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
